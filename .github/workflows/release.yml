name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/gabia/opensearch-dataprepper-k8s-operator

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Compute image tag
        id: vars
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "img=${IMAGE_NAME}:${version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.img }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Build consolidated install manifest
        run: make build-installer IMG=${{ steps.vars.outputs.img }}

      - name: Rename install manifest for this release
        run: cp dist/install.yaml "dist/install-${GITHUB_REF_NAME}.yaml"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/install-${{ github.ref_name }}.yaml
          generate_release_notes: true
