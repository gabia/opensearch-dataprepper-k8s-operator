# This rule is not used by the project dataprepper-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to dataprepper.gabia.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: dataprepper-operator
    app.kubernetes.io/managed-by: kustomize
  name: dataprepperclass-viewer-role
rules:
- apiGroups:
  - dataprepper.gabia.com
  resources:
  - dataprepperclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dataprepper.gabia.com
  resources:
  - dataprepperclasses/status
  verbs:
  - get
