# This rule is not used by the project opensearch-dataprepper-k8s-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the dataprepper.gabia.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: opensearch-dataprepper-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: dataprepperclass-editor-role
rules:
- apiGroups:
  - dataprepper.gabia.com
  resources:
  - dataprepperclasses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dataprepper.gabia.com
  resources:
  - dataprepperclasses/status
  verbs:
  - get
